<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Education Videos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="video-container">
        <!-- Main Canvas (Blackboard) -->
        <canvas id="blackboard" class="blackboard-canvas"></canvas>
        
        <!-- Teacher Avatar -->
        <div class="teacher-avatar" id="teacherAvatar">
            <img src="assets/images/teacher-avatar.svg" alt="Teacher" onerror="this.style.display='none'">
        </div>
        
        <!-- Video Controls -->
        <div class="controls-container" id="controlsContainer">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-filled" id="progressFilled"></div>
                </div>
            </div>
            <div class="controls">
                <button class="control-btn" id="playPauseBtn" title="Play/Pause (Space)">
                    <svg class="icon play-icon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg class="icon pause-icon" viewBox="0 0 24 24" style="display: none;">
                        <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                    </svg>
                </button>
                <div class="time-display" id="timeDisplay">
                    <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
                </div>
                <div class="volume-control">
                    <button class="control-btn" id="volumeBtn" title="Mute/Unmute">
                        <svg class="icon volume-icon" viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                        </svg>
                        <svg class="icon mute-icon" viewBox="0 0 24 24" style="display: none;">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                    </button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
                </div>
                <button class="control-btn" id="fullscreenBtn" title="Fullscreen">
                    <svg class="icon fullscreen-icon" viewBox="0 0 24 24">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Chapter/Slide Navigation -->
        <div class="chapter-selector" id="chapterSelector">
            <div class="chapter-header">
                <h3>Chapters</h3>
                <button class="close-btn" id="closeChaptersBtn">×</button>
            </div>
            <div class="chapter-list" id="chapterList">
                <!-- Chapters will be populated by JavaScript -->
            </div>
        </div>
        
        <!-- Chapter Toggle Button -->
        <button class="chapter-toggle-btn" id="chapterToggleBtn" title="Show Chapters">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
            </svg>
        </button>
    </div>

    <script src="js/canvas.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/chapters.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
